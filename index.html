<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex">
<title>The Wittenauer Family</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
:root{--bg:#EEF3F0;--surface:#FFFFFF;--ink:#13302C;--muted:#4F6762;--line:#CFDDD7;--accent:#16707F;--sun:#F2B134;--sun-ink:#3A2600;color-scheme:light}
@media (prefers-color-scheme: dark){:root{--bg:#0E1C1A;--surface:#162A27;--ink:#E6F0EC;--muted:#9FB7B0;--line:#2A4440;--accent:#4FB3C2;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Atkinson Hyperlegible",system-ui,sans-serif;font-size:17px;line-height:1.5;padding:48px 16px}
.wrap{max-width:560px;margin:0 auto;display:grid;gap:28px}
h1{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:800;font-size:clamp(2.4rem,10vw,3.4rem);line-height:1.05;margin:0;letter-spacing:-.02em}
h1 span{color:var(--accent)}
.eyebrow{font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
a.card{display:block;text-decoration:none;color:var(--sun-ink);background:var(--sun);border-radius:18px;padding:20px}
a.card b{display:block;font-family:"Bricolage Grotesque",system-ui,sans-serif;font-size:1.5rem}
a.card:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
p{margin:0}
</style></head><body>
<div class="wrap">
  <div><div class="eyebrow">wittenauer.family</div><h1>The <span>Witt</span> family</h1></div>
  <a class="card" href="/hiltonhead/"><span class="eyebrow" style="color:inherit;opacity:.8">Oct 11–17, 2026</span><b>Hilton Head trip hub →</b>Today's plan, things to do, photos, and the challenge.</a>
  <p style="color:var(--muted)">More family stuff lands here over time. Questions? Text Jimmy.</p>
</div>
</body></html>
