<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);-webkit-text-size-adjust:100%;text-size-adjust:100%}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>WittWeek</title>
<meta name="theme-color" content="#0B4F5C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="WittWeek">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap">
<style>
/* Layout: a native-feeling phone app — photo hero, floating cards, bottom tab bar, bottom sheets. Lowcountry palette: deep ocean, marsh teal, sunset coral, lighthouse gold. */
:root{
  --bg:#EEF3F4; --surface:#FFFFFF; --raised:#F6F9FA; --ink:#0E2A33; --muted:#5B7380; --line:#DCE6E9;
  --ocean:#0F6E7E; --ocean-deep:#0B4F5C; --ocean-ink:#FFFFFF; --coral:#FF6B4A; --gold:#FFB938; --gold-ink:#3A2600; --leaf:#22A06B;
  --shadow:0 1px 2px rgba(14,42,51,.06),0 8px 24px rgba(14,42,51,.08);
  --round:ui-rounded,"Nunito","SF Pro Rounded",-apple-system,system-ui,sans-serif;
  --r-lg:22px; --r-md:16px; --tab:68px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#06171C; --surface:#0E262D; --raised:#12303A; --ink:#E8F3F5; --muted:#8EA8B1; --line:#1D3A42;
  --ocean:#3BBFD0; --ocean-deep:#0B4F5C; --ocean-ink:#04232A; --coral:#FF8466; --gold:#FFC04D; --gold-ink:#2A1A00; --leaf:#3CC489;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#06171C; --surface:#0E262D; --raised:#12303A; --ink:#E8F3F5; --muted:#8EA8B1; --line:#1D3A42;
  --ocean:#3BBFD0; --ocean-deep:#0B4F5C; --ocean-ink:#04232A; --coral:#FF8466; --gold:#FFC04D; --gold-ink:#2A1A00; --leaf:#3CC489;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--round);font-size:17px;line-height:1.45;font-weight:600;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
h1,h2,h3,p{margin:0}
h1,h2,h3{text-wrap:balance;letter-spacing:-.01em}
.app{max-width:480px;margin:0 auto;min-height:100%;position:relative;padding-bottom:calc(var(--tab) + env(safe-area-inset-bottom,0px) + 24px)}
.screen{animation:fade .28s ease}
@keyframes fade{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
.pad{padding-inline:16px}
.stack{display:grid;gap:14px}
.label{font-size:.74rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:26px 16px 10px}
.sec h2{font-size:1.3rem;font-weight:900}
.sec .link{background:none;border:0;color:var(--ocean);font-weight:800;font-size:.95rem;padding:6px 0}
svg.i{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* hero */
.hero{position:relative;height:300px;overflow:hidden;color:#fff;background:linear-gradient(160deg,#0B4F5C 0%,#0F6E7E 45%,#FF8A5B 100%)}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(4,25,31,.55) 0%,rgba(4,25,31,.05) 35%,rgba(4,25,31,.15) 60%,rgba(4,25,31,.78) 100%)}
.hero .waves{position:absolute;bottom:0;left:0;width:100%;height:120px;opacity:.5}
.topbar{position:absolute;z-index:2;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 0}
.brand{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.16);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:6px 12px 6px 6px;font-weight:900;font-size:.95rem;color:#fff}
.brand .mark{width:26px;height:26px;border-radius:50%;background:var(--gold);display:grid;place-items:center}
.me{width:40px;height:40px;border-radius:50%;border:2px solid rgba(255,255,255,.85);display:grid;place-items:center;font-weight:900;color:#fff;font-size:1rem;background:var(--coral)}
.hello{position:absolute;z-index:2;left:16px;right:16px;bottom:58px}
.hello .label{color:rgba(255,255,255,.85)}
.hello h1{font-size:2.05rem;font-weight:900;line-height:1.05;margin-top:4px;text-shadow:0 2px 12px rgba(0,0,0,.25)}
.chips-row{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.glass{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.18);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.22);color:#fff;border-radius:999px;padding:5px 10px;font-size:.82rem;font-weight:800;text-decoration:none}
.glass svg.i{width:16px;height:16px}
.photo-credit{position:absolute;z-index:2;right:16px;bottom:62px;font-size:.72rem;color:rgba(255,255,255,.8)}
.dots{display:flex;gap:5px;margin-top:12px}
.dots i{height:5px;flex:1;border-radius:3px;background:rgba(255,255,255,.3)}
.dots i.done{background:rgba(255,255,255,.75)}
.dots i.now{background:var(--gold)}

/* cards */
.card{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:18px}
.now{margin:-44px 16px 0;position:relative;z-index:3}
.now .head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px;font-size:.74rem;font-weight:900;letter-spacing:.06em;text-transform:uppercase}
.pill.live{background:color-mix(in srgb,var(--coral) 14%,transparent);color:var(--coral)}
.pill.live::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--coral);animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--coral) 60%,transparent)}100%{box-shadow:0 0 0 8px transparent}}
.src{font-size:.78rem;color:var(--muted);font-weight:700}
.now h2{font-size:1.6rem;font-weight:900;line-height:1.1;margin-top:10px}
.where{display:flex;align-items:center;gap:6px;color:var(--muted);margin-top:6px;font-weight:700}
.where svg.i{width:18px;height:18px;color:var(--coral)}
.leave{display:flex;align-items:center;gap:14px;margin-top:16px;background:var(--raised);border-radius:var(--r-md);padding:12px 14px}
.ring{width:56px;height:56px;flex:none;position:relative}
.ring svg{width:56px;height:56px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:6}
.ring .bgc{stroke:var(--line)}
.ring .fg{stroke:var(--gold);stroke-linecap:round;transition:stroke-dashoffset .6s}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:.8rem;font-weight:900;font-variant-numeric:tabular-nums}
.leave .t{font-size:1.15rem;font-weight:900;font-variant-numeric:tabular-nums}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.btn{display:inline-flex;justify-content:center;align-items:center;gap:8px;min-height:52px;border-radius:16px;border:0;font-weight:900;font-size:1rem;text-decoration:none;padding:0 16px;transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--ocean);color:var(--ocean-ink)}
.btn.soft{background:var(--raised);color:var(--ink)}
.btn.coral{background:var(--coral);color:#fff}
.btn.gold{background:var(--gold);color:var(--gold-ink)}
.btn.full{width:100%}
.btn:focus-visible,.tab:focus-visible,.chip:focus-visible,.avatar-btn:focus-visible,.row:focus-visible,.tile:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.bring{margin-top:12px;font-size:.95rem;color:var(--muted)}
.bring b{color:var(--ink)}
.later{margin-top:14px;border-top:1px solid var(--line);padding-top:12px;display:grid;gap:8px}
.later div{display:flex;gap:10px;align-items:flex-start;font-size:.95rem}
.later div::before{content:"";width:8px;height:8px;margin-top:8px;border-radius:50%;background:var(--ocean);flex:none}

/* roll call */
.roll{margin-top:16px;border-top:1px solid var(--line);padding-top:14px}
.roll-top{display:flex;justify-content:space-between;align-items:center}
.faces{display:flex;margin-top:10px;flex-wrap:wrap;row-gap:6px}
.face{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:.8rem;font-weight:900;color:#fff;border:2px solid var(--surface);margin-right:-8px}
.face.out{opacity:.28;filter:grayscale(1)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.seg button{min-height:48px;border-radius:14px;border:2px solid var(--line);background:var(--surface);font-weight:900}
.seg button[aria-pressed="true"].in{background:var(--leaf);border-color:var(--leaf);color:#fff}
.seg button[aria-pressed="true"].out{background:var(--raised);border-color:var(--muted)}

/* dare */
.dare{margin:14px 16px 0;border-radius:var(--r-lg);padding:18px;color:#fff;background:linear-gradient(135deg,#FF6B4A 0%,#FF9A3D 100%);box-shadow:var(--shadow);position:relative;overflow:hidden}
.dare .label{color:rgba(255,255,255,.9)}
.dare h3{font-size:1.3rem;font-weight:900;margin:6px 0 14px;line-height:1.2;max-width:85%}
.dare .big{position:absolute;right:-6px;top:-8px;font-size:5rem;opacity:.25;line-height:1}
.dare .btn{background:#fff;color:#C24124}

/* leaderboard */
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;align-items:end;gap:8px;text-align:center}
.pod{display:grid;justify-items:center;gap:6px}
.pod .face{width:52px;height:52px;margin:0;font-size:1.1rem}
.pod.first .face{width:64px;height:64px;font-size:1.3rem;box-shadow:0 0 0 3px var(--gold)}
.pod .bar{width:100%;border-radius:12px 12px 4px 4px;background:var(--raised);display:grid;place-items:center;font-weight:900;font-variant-numeric:tabular-nums}
.pod .nm{font-size:.85rem;font-weight:800}
.lb-rest{display:grid;gap:6px;margin-top:14px}
.lbrow{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px}
.lbrow.me{background:color-mix(in srgb,var(--ocean) 12%,transparent)}
.lbrow .face{margin:0;width:30px;height:30px;font-size:.75rem}
.lbrow span{flex:1}
.lbrow b{font-variant-numeric:tabular-nums}
details.check{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
details.check summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;font-weight:900;color:var(--ocean)}
details.check summary::-webkit-details-marker{display:none}
.chk{display:flex;align-items:center;gap:12px;padding:10px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.chk input{width:24px;height:24px;accent-color:var(--leaf);flex:none}
.chk span{flex:1;font-size:.95rem}
.chk em{font-style:normal;font-weight:900;color:var(--leaf);font-variant-numeric:tabular-nums}

/* picks */
.picks .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 14px;font-weight:800;font-size:.92rem;min-height:44px}
.chip[aria-pressed="true"]{background:var(--ocean);border-color:var(--ocean);color:var(--ocean-ink)}
.progress{height:8px;border-radius:4px;background:var(--raised);overflow:hidden;margin-top:12px}
.progress i{display:block;height:100%;background:var(--leaf);border-radius:4px;transition:width .5s}
.saved{color:var(--leaf);font-weight:900;font-size:.92rem;min-height:1.3em;margin-top:8px}
.toplist{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.toplist span{background:var(--raised);border-radius:10px;padding:6px 10px;font-size:.85rem;font-weight:800}

/* plan */
.datestrip{display:flex;gap:8px;overflow-x:auto;padding:4px 16px 8px;scrollbar-width:none;scroll-snap-type:x mandatory}
.datestrip::-webkit-scrollbar{display:none}
.dpill{flex:none;width:58px;border-radius:18px;border:2px solid var(--line);background:var(--surface);padding:10px 0;display:grid;justify-items:center;gap:2px;scroll-snap-align:center}
.dpill small{font-size:.72rem;font-weight:900;text-transform:uppercase;color:var(--muted);letter-spacing:.06em}
.dpill b{font-size:1.3rem;font-weight:900}
.dpill.today{border-color:var(--gold)}
.dpill[aria-pressed="true"]{background:var(--ocean);border-color:var(--ocean);color:var(--ocean-ink)}
.dpill[aria-pressed="true"] small{color:inherit;opacity:.8}
.timeline{display:grid;gap:0;margin-top:8px}
.tl{display:grid;grid-template-columns:22px 1fr;gap:10px;position:relative;padding-bottom:16px}
.tl::before{content:"";position:absolute;left:10px;top:18px;bottom:0;width:2px;background:var(--line)}
.tl:last-child::before{display:none}
.tl i{width:22px;height:22px;border-radius:50%;background:var(--surface);border:3px solid var(--ocean);margin-top:2px;position:relative;z-index:1}
.warn{margin-top:4px;background:color-mix(in srgb,var(--coral) 12%,transparent);color:var(--coral);border-radius:12px;padding:10px 12px;font-weight:800;font-size:.9rem}
.eatrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.eatrow:last-of-type{border-bottom:0}
.eatrow .ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--raised);color:var(--coral);flex:none}
.eatrow div{flex:1;min-width:0}
.eatrow small{display:block;color:var(--muted);font-size:.82rem;font-weight:700}
.status{font-size:.72rem;font-weight:900;border-radius:999px;padding:4px 9px;background:var(--raised);color:var(--muted);white-space:nowrap}
.status.yes{background:color-mix(in srgb,var(--leaf) 16%,transparent);color:var(--leaf)}
.status.no{background:color-mix(in srgb,var(--coral) 14%,transparent);color:var(--coral)}
.status.work{background:color-mix(in srgb,var(--gold) 22%,transparent);color:color-mix(in srgb,var(--gold) 60%,var(--ink))}

/* explore */
.tiles{display:flex;gap:12px;overflow-x:auto;padding:4px 16px 8px;scrollbar-width:none;scroll-snap-type:x mandatory}
.tiles::-webkit-scrollbar{display:none}
.tile{flex:none;width:72%;max-width:300px;aspect-ratio:4/5;border-radius:var(--r-lg);border:0;padding:18px;color:#fff;text-align:left;display:flex;flex-direction:column;justify-content:space-between;scroll-snap-align:start;box-shadow:var(--shadow);position:relative;overflow:hidden}
.tile .glyph{width:64px;height:64px;border-radius:20px;background:rgba(255,255,255,.2);display:grid;place-items:center}
.tile .glyph svg.i{width:34px;height:34px}
.tile h3{font-size:1.4rem;font-weight:900;line-height:1.1}
.tile p{font-size:.88rem;opacity:.92;margin-top:6px}
.tile .rank{position:absolute;top:16px;right:16px;font-weight:900;font-size:.8rem;background:rgba(0,0,0,.2);border-radius:999px;padding:4px 10px}
.filters{display:flex;gap:8px;overflow-x:auto;padding:0 16px 10px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters .chip{flex:none}
.list{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow);margin:0 16px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border:0;border-bottom:1px solid var(--line);background:none;width:100%;text-align:left}
.row:last-child{border-bottom:0}
.row .ic{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;color:#fff;flex:none}
.row div{flex:1;min-width:0}
.row b{display:block;font-weight:900;font-size:1rem}
.row small{color:var(--muted);font-size:.82rem;font-weight:700}
.row .heart{color:var(--coral);font-size:1.2rem}

/* photos */
.potd{margin:0 16px;border-radius:var(--r-lg);overflow:hidden;position:relative;aspect-ratio:4/3;background:var(--raised);box-shadow:var(--shadow)}
.potd img{width:100%;height:100%;object-fit:cover;display:block}
.potd .cap{position:absolute;left:0;right:0;bottom:0;padding:40px 16px 14px;color:#fff;background:linear-gradient(0deg,rgba(0,0,0,.7),transparent)}
.potd .crown{position:absolute;top:12px;left:12px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin:12px 16px 0;border-radius:var(--r-md);overflow:hidden}
.grid button{border:0;padding:0;aspect-ratio:1;position:relative;background:var(--raised);overflow:hidden}
.grid img{width:100%;height:100%;object-fit:cover;display:block}
.grid .h{position:absolute;right:4px;bottom:4px;background:rgba(0,0,0,.45);color:#fff;border-radius:999px;padding:2px 7px;font-size:.72rem;font-weight:900}
.empty{margin:12px 16px 0;border:2px dashed var(--line);border-radius:var(--r-lg);padding:28px 18px;text-align:center;color:var(--muted)}
.fab{position:fixed;z-index:20;right:max(16px,calc(50% - 240px + 16px));bottom:calc(var(--tab) + env(safe-area-inset-bottom,0px) + 16px);height:58px;border-radius:999px;border:0;background:var(--coral);color:#fff;font-weight:900;padding:0 22px;display:flex;align-items:center;gap:8px;box-shadow:0 10px 24px color-mix(in srgb,var(--coral) 45%,transparent)}

/* genie */
.chat{display:grid;gap:10px;padding:8px 16px 140px}
.bub{max-width:84%;padding:12px 14px;border-radius:20px;font-size:.98rem;line-height:1.4;box-shadow:var(--shadow)}
.bub.g{background:var(--surface);border-bottom-left-radius:6px}
.bub.u{background:var(--ocean);color:var(--ocean-ink);justify-self:end;border-bottom-right-radius:6px}
.bub small{display:block;font-size:.74rem;opacity:.7;margin-bottom:2px;font-weight:800}
.typing{display:inline-flex;gap:4px;vertical-align:middle;margin-left:4px}
.typing i{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.4;animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,100%{opacity:.2}50%{opacity:.9}}
.genie-hero{margin:8px 16px 4px;display:flex;gap:12px;align-items:center}
.genie-hero .orb{width:56px;height:56px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFE29A,#FFB938 45%,#FF6B4A 100%);display:grid;place-items:center;font-size:1.6rem;box-shadow:0 8px 20px color-mix(in srgb,var(--gold) 40%,transparent);flex:none}
.cap-badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.cap-badges span{font-size:.75rem;font-weight:900;background:var(--raised);border-radius:999px;padding:3px 9px;color:var(--muted)}
.composer{position:fixed;z-index:20;left:50%;transform:translateX(-50%);width:100%;max-width:480px;bottom:calc(var(--tab) + env(safe-area-inset-bottom,0px));padding:10px 16px;background:linear-gradient(0deg,var(--bg) 70%,transparent)}
.sugg{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
.sugg::-webkit-scrollbar{display:none}
.sugg .chip{flex:none;min-height:38px;padding:6px 12px;font-size:.85rem}
.inbar{display:flex;gap:8px;background:var(--surface);border-radius:999px;box-shadow:var(--shadow);padding:6px}
.inbar input{flex:1;min-width:0;border:0;background:transparent;font:inherit;color:var(--ink);padding:0 12px;outline:none;font-size:1rem}
.inbar button{width:46px;height:46px;border-radius:50%;border:0;background:var(--ocean);color:var(--ocean-ink);display:grid;place-items:center;flex:none}

/* tab bar */
.tabbar{position:fixed;z-index:30;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:480px;display:grid;grid-template-columns:repeat(5,1fr);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--surface) 86%,transparent);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border-top:1px solid var(--line)}
.tab{border:0;background:none;display:grid;justify-items:center;gap:2px;padding:6px 0;min-height:56px;color:var(--muted);font-size:.72rem;font-weight:900;border-radius:14px}
.tab[aria-current="page"]{color:var(--ocean)}
.tab[aria-current="page"] svg.i{stroke-width:2.6}
.tab .dot{width:6px;height:6px;border-radius:50%;background:var(--coral);position:absolute;margin-left:18px;margin-top:2px}

/* sheet */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(3,15,19,.45);opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:41;left:50%;bottom:0;width:100%;max-width:480px;transform:translate(-50%,105%);transition:transform .32s cubic-bezier(.2,.9,.2,1);background:var(--surface);border-radius:26px 26px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow:auto}
.sheet.on{transform:translate(-50%,0)}
.grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px}
.sheet .ic{width:64px;height:64px;border-radius:20px;display:grid;place-items:center;color:#fff}
.sheet .ic svg.i{width:32px;height:32px}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.meta span{background:var(--raised);border-radius:10px;padding:5px 10px;font-size:.82rem;font-weight:800}
.meta span.hot{background:var(--gold);color:var(--gold-ink)}
.tip{margin-top:14px;background:var(--raised);border-radius:14px;padding:12px 14px;font-size:.92rem}

/* onboarding */
.onb{position:fixed;inset:0;z-index:60;background:radial-gradient(120% 80% at 50% 0%,#14808F 0%,#0B4F5C 45%,#062F38 100%);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px calc(24px + env(safe-area-inset-bottom,0px));text-align:center;overflow:auto}
.onb .logo{width:84px;height:84px;border-radius:26px;background:var(--gold);display:grid;place-items:center;box-shadow:0 14px 40px rgba(0,0,0,.35);margin-bottom:18px}
.onb h1{font-size:2.2rem;font-weight:900}
.onb p{opacity:.85;margin-top:6px}
.who{display:grid;grid-template-columns:repeat(3,1fr);gap:16px 10px;margin-top:28px;width:100%;max-width:400px}
.avatar-btn{border:0;background:none;color:#fff;display:grid;justify-items:center;gap:8px;font-weight:900}
.avatar-btn .face{width:72px;height:72px;font-size:1.5rem;margin:0;border:3px solid rgba(255,255,255,.35);transition:transform .15s}
.avatar-btn:active .face{transform:scale(.92)}
.other{margin-top:22px;display:flex;gap:8px;width:100%;max-width:340px}
.other input{flex:1;min-width:0;border-radius:14px;border:0;padding:0 14px;min-height:50px;font:inherit;font-weight:700}
.other .btn{background:var(--gold);color:var(--gold-ink)}
.toast{position:fixed;z-index:70;left:50%;top:calc(env(safe-area-inset-top,0px) + 14px);transform:translate(-50%,-140%);transition:transform .3s cubic-bezier(.2,.9,.2,1);background:var(--ink);color:var(--bg);border-radius:999px;padding:10px 18px;font-weight:900;font-size:.92rem;box-shadow:var(--shadow);white-space:nowrap}
.toast.on{transform:translate(-50%,0)}
.foot{text-align:center;color:var(--muted);font-size:.8rem;margin:30px 16px 0}
.foot button{background:none;border:0;color:var(--ocean);font-weight:900;font-size:.8rem}


/* quiz */
.quiz{position:fixed;inset:0;z-index:65;background:var(--bg);display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(16px + env(safe-area-inset-bottom,0px));max-width:480px;margin:0 auto}
.qtop{display:flex;align-items:center;gap:12px}
.qtop button{border:0;background:var(--raised);border-radius:12px;min-width:44px;min-height:44px;font-weight:900}
.qbar{flex:1;height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.qbar i{display:block;height:100%;background:linear-gradient(90deg,var(--ocean),var(--leaf));transition:width .35s}
.qbody{flex:1;overflow:auto;padding:22px 2px 12px;animation:fade .28s ease}
.qbody .kick{font-size:.78rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--coral)}
.qbody h2{font-size:1.75rem;font-weight:900;line-height:1.12;margin-top:6px}
.qbody .hint{color:var(--muted);margin-top:6px;font-weight:700}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.opts.one{grid-template-columns:1fr}
.opt{border:2px solid var(--line);background:var(--surface);border-radius:18px;padding:14px 12px;min-height:84px;display:grid;justify-items:start;align-content:center;gap:4px;text-align:left;font-weight:900;font-size:1rem;box-shadow:var(--shadow);transition:transform .1s}
.opt:active{transform:scale(.97)}
.opt .em{font-size:1.6rem;line-height:1}
.opt small{font-weight:700;color:var(--muted);font-size:.8rem}
.opt[aria-pressed="true"]{border-color:var(--ocean);background:color-mix(in srgb,var(--ocean) 12%,var(--surface))}
.opt.face-opt{justify-items:center;text-align:center;min-height:96px}
.opt.face-opt .face{margin:0;width:44px;height:44px}
.qbody textarea{width:100%;min-height:120px;margin-top:18px;border-radius:18px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:700;padding:14px;resize:none}
.qfoot{display:grid;gap:8px}
.qskip{border:0;background:none;color:var(--muted);font-weight:800;min-height:40px}
.done-burst{font-size:4rem;text-align:center;margin-top:30px}
/* personal */
.mine{margin:14px 16px 0;border-radius:var(--r-lg);padding:18px;background:var(--surface);box-shadow:var(--shadow);border:2px solid color-mix(in srgb,var(--ocean) 35%,transparent)}
.mine .note{background:var(--raised);border-radius:14px;padding:12px 14px;margin-top:10px;font-size:.95rem}
.mrow{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.mrow .ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;color:#fff;flex:none}
.mrow div{flex:1;min-width:0}
.mrow small{display:block;color:var(--muted);font-size:.8rem;font-weight:700}
.cover{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:.9rem;font-weight:800}
.cover .progress{flex:1;margin:0}
.vote{padding:12px 0;border-top:1px solid var(--line)}
.vote:first-child{border-top:0;padding-top:0}
.vote b{display:block;margin-bottom:8px}
.vopt{display:flex;align-items:center;gap:10px;width:100%;border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:0 12px;min-height:48px;margin-top:6px;position:relative;overflow:hidden;font-weight:800;text-align:left}
.vopt .fill{position:absolute;inset:0;width:0;background:color-mix(in srgb,var(--ocean) 14%,transparent);transition:width .4s}
.vopt span{position:relative;flex:1}
.vopt em{position:relative;font-style:normal;font-weight:900;color:var(--muted);font-variant-numeric:tabular-nums}
.vopt[aria-pressed="true"]{border-color:var(--ocean)}
.cta-personal{margin:14px 16px 0;width:calc(100% - 32px)}

/* pong */
.champ{margin:0 16px;border-radius:var(--r-lg);padding:20px;color:#fff;background:radial-gradient(120% 120% at 0% 0%,#1C8B9C 0%,#0B4F5C 50%,#062F38 100%);box-shadow:var(--shadow);position:relative;overflow:hidden}
.champ .face{width:64px;height:64px;font-size:1.4rem;margin:0;box-shadow:0 0 0 3px var(--gold)}
.champ .row1{display:flex;gap:14px;align-items:center}
.champ h2{font-size:1.5rem;font-weight:900}
.champ .bounty{margin-top:14px;background:rgba(255,255,255,.12);border-radius:14px;padding:10px 12px;font-size:.92rem;font-weight:800}
.champ .bounty b{color:var(--gold)}
.champ .ball{position:absolute;right:-30px;top:-30px;width:130px;height:130px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#FFD9A0 60%,#FFB938);opacity:.18}
.stand{display:grid;grid-template-columns:22px 34px 1fr auto auto;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.stand:last-child{border-bottom:0}
.stand .face{margin:0;width:34px;height:34px}
.stand .rk{font-weight:900;color:var(--muted);text-align:center}
.stand .wl{font-weight:900;font-variant-numeric:tabular-nums}
.stand .st{font-size:.8rem;font-weight:900;min-width:44px;text-align:right}
.rival{display:grid;gap:8px;padding:12px 0;border-bottom:1px solid var(--line)}
.rival:last-child{border-bottom:0}
.rival .names{display:flex;justify-content:space-between;font-weight:900}
.rival .bar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--raised)}
.rival .bar i:first-child{background:var(--ocean)}.rival .bar i:last-child{background:var(--coral)}
.feed{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:.95rem}
.feed:last-child{border-bottom:0}
.feed span{flex:1}
.feed .undo{border:0;background:var(--raised);border-radius:10px;padding:6px 10px;font-weight:900;font-size:.8rem}
.pickp{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.pickp .chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px 6px 6px}
.pickp .chip .face{width:28px;height:28px;margin:0;font-size:.75rem;border:0}
.board{position:fixed;inset:0;z-index:80;background:#06171C;color:#fff;display:grid;grid-template-rows:1fr auto 1fr;user-select:none;-webkit-user-select:none}
.half{border:0;color:#fff;display:grid;place-items:center;position:relative;font-family:var(--round);padding:0;touch-action:manipulation}
.half.a{background:linear-gradient(180deg,#0B4F5C,#0F6E7E)}
.half.b{background:linear-gradient(0deg,#C2412A,#FF6B4A)}
.half.flip .inner{transform:rotate(180deg)}
.half .inner{display:grid;justify-items:center;gap:2px}
.half .nm{font-size:1.3rem;font-weight:900;opacity:.92}
.half .sc{font-size:clamp(6rem,30vw,10rem);font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
.half .srv{font-size:.9rem;font-weight:900;background:rgba(255,255,255,.2);border-radius:999px;padding:4px 12px;visibility:hidden}
.half .srv.on{visibility:visible}
.mid{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;background:#06171C}
.mid button{border:0;border-radius:12px;background:rgba(255,255,255,.12);color:#fff;font-weight:900;padding:10px 14px;min-height:44px}
.mid .call{font-weight:900;color:var(--gold);letter-spacing:.06em;text-transform:uppercase;font-size:.85rem;text-align:center;flex:1}
.win{position:fixed;inset:0;z-index:81;background:radial-gradient(100% 70% at 50% 30%,#14808F,#062F38);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:10px;overflow:hidden}
.win h1{font-size:2.4rem;font-weight:900;line-height:1.05}
.win .face{width:96px;height:96px;font-size:2rem;margin:0;box-shadow:0 0 0 4px var(--gold)}
.win .btns{width:100%;max-width:360px}
.confetti{position:absolute;top:-10px;width:10px;height:16px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

/* QA round 1: legibility + tap targets */
body{font-size:18px}
.label{font-size:.8rem}
.tab{font-size:.8rem}
.dpill small{font-size:.8rem}
.opt small,.mrow small,.row small,.eatrow small{font-size:.85rem}
.pill.live{color:#B23A1E;background:#FFE3DA}
.status.no{color:#B23A1E;background:#FFE3DA}
:root[data-theme="dark"] .pill.live,:root[data-theme="dark"] .status.no{color:#FFB4A0;background:#4A1E14}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .pill.live,:root:not([data-theme="light"]) .status.no{color:#FFB4A0;background:#4A1E14}}
.eatrow small a{display:inline-flex;align-items:center;min-height:44px;padding:0 6px;font-weight:900;color:var(--ocean)}
.mine .link,.foot button,.sec .link{min-height:44px;padding:0 10px}
.glass{min-height:40px;padding:6px 12px}
.sugg .chip{min-height:44px}
.sticky-cta{position:sticky;bottom:0;z-index:2;box-shadow:0 -12px 18px var(--surface)}
.toast{top:calc(env(safe-area-inset-top,0px) + 64px);opacity:0;visibility:hidden;pointer-events:none;transition:transform .3s cubic-bezier(.2,.9,.2,1),opacity .2s,visibility 0s .3s}
.toast.on{opacity:1;visibility:visible;transition:transform .3s cubic-bezier(.2,.9,.2,1),opacity .2s}
.onb{justify-content:flex-start}
.onb>:first-child{margin-top:auto}
.onb>:last-child{margin-bottom:auto}
.opt{min-height:96px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

async function api(action,payload){
  if(LIVE){
    const r=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action,...payload})});
    const j=await r.json(); if(j&&j.error) throw new Error(j.error); return j;
  }
  const db=localDB();const today=ymd(now());
  if(action==="rollcall"){db.rollcall=db.rollcall.filter(r=>!(r.date===today&&r.name===payload.name));db.rollcall.push({date:today,name:payload.name,status:payload.status})}
  if(action==="picks"){db.picks=db.picks.filter(p=>p.name!==payload.name);db.picks.push({name:payload.name,picks:payload.picks,note:payload.note||""})}
  if(action==="genie"){db.genie.push({id:"g"+Date.now(),at:Date.now(),name:payload.name,ask:payload.ask,status:"new",answer:""})}
  if(action==="challenge"){db.challenge=db.challenge.filter(c=>c.name!==payload.name);db.challenge.push({name:payload.name,points:payload.points})}
  if(action==="photo"){db.photos.push({id:"p"+Date.now(),at:Date.now(),name:payload.name,thumb_url:payload.dataUrl,caption:payload.caption||"",date:today,hearts:0})}
  if(action==="profile"){db.profiles=(db.profiles||[]).filter(x=>x.name!==payload.name);db.profiles.push({name:payload.name,answers:payload.answers})}
  if(action==="vote"){db.votes=(db.votes||[]).filter(x=>!(x.name===payload.name&&x.q===payload.q));db.votes.push({name:payload.name,q:payload.q,choice:payload.choice})}
  if(action==="match"){db.matches=db.matches||[];db.matches.push({id:"m"+Date.now(),at:Date.now(),winner:payload.winner,loser:payload.loser,ws:payload.ws,ls:payload.ls,by:payload.name})}
  if(action==="undoMatch"){db.matches=(db.matches||[]).filter(m=>m.id!==payload.id)}
  if(action==="heart"){const p=db.photos.find(x=>x.id===payload.photo_id);if(p)p.hearts=Math.max(0,p.hearts+(payload.on?1:-1))}
  try{store.set("db",db)}catch(e){}
  return {ok:true};
}
let online=true;
async function refresh(){
  if(LIVE){
    try{let r=await fetch(API_URL+"?action=state&name="+encodeURIComponent(ME||""));let next=await r.json();
      if(next.error==="Choose a name from Family"&&ME){ME="";store.set("me","");myProfile={};myPicks=[];myDone=new Set();myRoll="";r=await fetch(API_URL+"?action=state");next=await r.json()}
      if(next.error)throw new Error(next.error);S=next;online=true;store.set("state-cache",next)}
    catch(e){online=false}
  } else S=localState();
  if(!S.family||!S.family.length)S.family=SEED_FAMILY.map(n=>({name:n}));
  if(S.picks&&S.picks.top)S.picks.top=S.picks.top.map(t=>({...t,votes:t.votes??t.count??0}));
  if(!S.matches)S.matches=[];
  if(!S.votes)S.votes={};
  if(!S.notes)S.notes={};
  if(!S.eat||!S.eat.length)S.eat=SEED_EAT.map(([name,note])=>({name,note,status:"Not called yet"}));
  render();
  if(!ME&&!$("#onb"))onboarding();
}

function suggestFor(p){
  const nos=new Set(p.nos||[]),picks=p.picks||[],vibes=p.vibe||[];
  const others={};(S.picks.top||[]).forEach(t=>others[t.id]=t.votes);
  return A.map(a=>{
    if((TAGS[a.id]||[]).some(t=>nos.has(t)))return null;
    let sc=0,why="";
    if(picks.includes(a.id)){sc+=5;why="One of your top 3"}
    vibes.forEach(v=>{if((VIBE[v]||[]).includes(a.cat)||(VIBE_IDS[v]||[]).includes(a.id)){sc+=2;if(!why){const o=QUIZ[0].opts.find(o=>o[0]===v);why=`Because you love ${o[2].toLowerCase()}`}}});
    if(p.energy==="easy"&&/hr|min/.test(a.time)&&!/Full/.test(a.time))sc+=1;
    if(p.energy==="go"&&(a.cat==="adventure"||a.cat==="daytrip"))sc+=1;
    if(others[a.id]){sc+=others[a.id];if(!why)why=`${others[a.id]} in the family want this too`}
    return sc>0?{a,sc,why:why||"A good fit for you"}:null;
  }).filter(Boolean).sort((x,y)=>y.sc-x.sc).slice(0,3);
}
function coverage(p){
  const picks=p.picks||[];if(!picks.length)return null;
  const txt=PLAN.map(d=>d.i.join(" ")).join(" ");
  return {hit:picks.filter(id=>PLANKEY[id]&&PLANKEY[id].test(txt)).length,total:picks.length};
}

function pongStats(){
  const ms=(S.matches||[]).slice().sort((a,b)=>(+new Date(a.at))-(+new Date(b.at)));
  const P={},h2h={};const get=n=>P[n]||(P[n]={name:n,w:0,l:0,elo:1000,streak:0});
  ms.forEach(m=>{const W=get(m.winner),L=get(m.loser);const ew=1/(1+10**((L.elo-W.elo)/400));W.elo+=32*(1-ew);L.elo-=32*(1-ew);W.w++;L.l++;W.streak=W.streak>0?W.streak+1:1;L.streak=L.streak<0?L.streak-1:-1;
    const k=[m.winner,m.loser].sort().join("|");(h2h[k]=h2h[k]||{})[m.winner]=(h2h[k][m.winner]||0)+1});
  return {ms,table:Object.values(P).sort((a,b)=>b.elo-a.elo||b.w-a.w),h2h,P};
}
function pongPoints(){const pts={};(S.matches||[]).forEach(m=>{pts[m.winner]=(pts[m.winner]||0)+5+(m.loser===CHAMP?25:0)});return pts}
function totalBoard(){
  const t={};(S.leaderboard||[]).forEach(x=>t[x.name]=(t[x.name]||0)+(+x.points||0));
  if(ME&&!(S.leaderboard||[]).some(x=>x.name===ME))t[ME]=(t[ME]||0)+myPoints();
  Object.entries(pongPoints()).forEach(([n,p])=>t[n]=(t[n]||0)+p);
  return Object.entries(t).map(([name,points])=>({name,points})).sort((a,b)=>b.points-a.points);
}

    <div class="bounty">${beatJ.length?`💥 Champ-slayers: <b>${[...new Set(beatJ.map(m=>m.winner))].map(esc).join(", ")}</b>`:`🎯 Bounty: beat Jimmy, earn <b>+25 bonus points</b>. Every win is +5.`}</div>
  </section>
  <div class="btns" style="margin:14px 16px 0"><button class="btn gold" data-board>▶ Start a game</button><button class="btn soft" data-logmatch>+ Log a result</button></div>
  <div class="sec"><h2>Standings</h2><span class="muted" style="font-size:.82rem;font-weight:800">Ranked by power rating</span></div>
  <section class="card" style="margin:0 16px">${table.length?table.map((p,i)=>`<div class="stand"><span class="rk">${i===0?"👑":i+1}</span>${face(p.name)}<b>${esc(p.name)}</b><span class="wl">${p.w}–${p.l}</span><span class="st" style="color:${p.streak>0?"var(--leaf)":"var(--coral)"}">${p.streak>=3?"🔥"+p.streak:p.streak>0?"W"+p.streak:"L"+(-p.streak)}</span></div>`).join(""):`<p class="muted" style="text-align:center;padding:8px 0">No games yet. Start one and the table fills itself.</p>`}</section>

  <section class="card" style="margin:0 16px">${rivals.slice(0,6).map(([a,b])=>{const k=[a,b].sort().join("|");const r=h2h[k]||{};const wa=r[a]||0,wb=r[b]||0,tot=wa+wb;return `<div class="rival"><div class="names"><span>${esc(a)} <span style="color:var(--ocean)">${wa}</span></span><span class="muted" style="font-size:.8rem">${tot?tot+" games":"Last year: Jimmy"}</span><span><span style="color:var(--coral)">${wb}</span> ${esc(b)}</span></div><div class="bar"><i style="width:${tot?wa/tot*100:50}%"></i><i style="width:${tot?wb/tot*100:50}%"></i></div></div>`}).join("")}</section>
  ${rec.length?`<div class="sec"><h2>Latest games</h2></div><section class="card" style="margin:0 16px">${rec.map((m,i)=>`<div class="feed">${face(m.winner)}<span><b>${esc(m.winner)}</b> beat ${esc(m.loser)}${m.ws!=null&&m.ws!==""?` <b>${m.ws}–${m.ls}</b>`:""}${m.loser===CHAMP?" 💥":""}</span>${i===0&&m.by===ME&&Date.now()-(+new Date(m.at))<6e5?`<button class="undo" data-undo="${esc(m.id)}">Undo</button>`:""}</div>`).join("")}</section>`:""}

function drawBoard(){
  let el=$("#board");if(!el){el=document.createElement("div");el.className="board";el.id="board";document.body.appendChild(el)}
  const {a,b,sa,sb,to}=BS;const n=sa+sb,k=to===11?2:5,ds=(to-1)*2;const turns=n<ds?Math.floor(n/k):Math.floor(ds/k)+(n-ds);
  const srvA=(turns%2===0)===(BS.first==="a");
  const gp=(x,y)=>x>=to-1&&x>y;const deuce=sa>=to-1&&sb>=to-1&&sa===sb;
  const call=deuce?"Deuce":gp(sa,sb)?`Game point ${a}`:gp(sb,sa)?`Game point ${b}`:`First to ${to}`;
  el.innerHTML=`<button class="half a flip" data-score="a" aria-label="Point ${esc(a)}"><span class="inner"><span class="srv ${srvA?"on":""}">🏓 Serving</span><span class="sc">${sa}</span><span class="nm">${esc(a)}</span></span></button>
  <div class="mid"><button data-undopt>↶ Undo</button><span class="call">${esc(call)}</span><button data-endgame>End</button></div>
  <button class="half b" data-score="b" aria-label="Point ${esc(b)}"><span class="inner"><span class="srv ${!srvA?"on":""}">🏓 Serving</span><span class="sc">${sb}</span><span class="nm">${esc(b)}</span></span></button>`;
}
async function finishGame(){
  const {a,b,sa,sb}=BS;const w=sa>sb?a:b,l=sa>sb?b:a,ws=Math.max(sa,sb),ls=Math.min(sa,sb);
  $("#board")&&$("#board").remove();
  const el=document.createElement("div");el.className="win";el.id="win";
  const champFall=l===CHAMP;
  el.innerHTML=`${Array.from({length:40},(_,i)=>`<i class="confetti" style="left:${Math.random()*100}%;background:${COLORS[i%COLORS.length]};animation-duration:${2+Math.random()*2}s;animation-delay:${Math.random()*.6}s"></i>`).join("")}
  ${face(w)}<div class="label" style="color:rgba(255,255,255,.8)">${champFall?"💥 The champ has fallen":"Winner"}</div><h1>${esc(w)} wins<br>${ws}–${ls}</h1>
  <p style="opacity:.85">${champFall?`+30 points for ${esc(w)}. Bounty claimed.`:`+5 points. Saved to the Witt Cup.`}</p>
  <div class="btns"><button class="btn gold" data-rematch>Rematch</button><button class="btn soft" data-closewin style="background:rgba(255,255,255,.15);color:#fff">Done</button></div>`;
  document.body.appendChild(el);
  try{await api("match",{name:ME,winner:w,loser:l,ws,ls});refresh()}catch(e){toast("Couldn't save the game. Log it by hand.")}
}

  e.target.value="";TAB="photos";store.set("tab",TAB);await refresh();toast("Added to the family album ✓");
});
function shrink(file,max){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const s=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext("2d").drawImage(img,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",.82))};img.onerror=rej;img.src=r.result};r.onerror=rej;r.readAsDataURL(file)})}

/* countdown ring */
function afterRender(){
  if(TAB!=="today")return;
  const n=currentNow();const leave=parseTime(n.leave_by,dateOf(n.d));if(!leave||!$("#ring"))return;
  const tick=()=>{const ms=leave-now();const fg=document.querySelector(".ring .fg");const txt=$("#ringTxt");const lin=$("#leaveIn");if(!fg)return;
    if(ms<=0){fg.style.strokeDashoffset=0;txt.textContent="Go!";lin.textContent=ms>-36e5?"Time to head out":"Already underway";return}
    const mins=Math.round(ms/6e4);const frac=Math.max(0,Math.min(1,1-mins/180));fg.style.strokeDashoffset=150.8*(1-frac);
    txt.textContent=mins>=60?`${Math.floor(mins/60)}h`:`${mins}m`;lin.textContent=mins>=60?`in ${Math.floor(mins/60)} hr ${mins%60} min`:`in ${mins} min`};
  tick();clearInterval(afterRender._t);afterRender._t=setInterval(tick,30000);
}

/* ===== BOOT ===== */
(async function(){
  const cached=store.get("state-cache",null);
  if(LIVE){S=cached&&cached.family?cached:{...S,family:SEED_FAMILY.map(n=>({name:n})),eat:SEED_EAT.map(([name,note])=>({name,note,status:"Not called yet"}))};render();if(!ME&&!$("#onb"))onboarding();refresh();}
  else await refresh();
  const hashName=decodeURIComponent((location.hash||"").slice(1));const hit=hashName&&S.family.find(f=>f.name.toLowerCase()===hashName.toLowerCase());
  if(hit&&hit.name!==ME)setMe(hit.name); else if(!ME&&!$("#onb")) onboarding();
  loadWeather(); loadTide();
  if(LIVE) setInterval(()=>{if(document.visibilityState==="visible"&&!$("#sheet").classList.contains("on"))refresh()},30000);
})();
